[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-agent"
version = "2.0.0"
description = "Autonomous Multi-Agent System for Forward Deployment Engineers using LangGraph and LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.0",
    "langgraph>=1.2.0",
    "langchain-openai>=1.7.0",
    "langchain-core>=1.6.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
fde = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

